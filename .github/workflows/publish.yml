name: publish

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write # GitHub Release creation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve plugin from tag
        id: resolve
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ -z "$NAME" ] || [ -z "$VERSION" ]; then
            echo "::error::tag '${TAG}' must match '<package-name>-v<version>'"
            exit 1
          fi
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify plugin directory and version
        shell: bash
        run: |
          DIR="plugins/${{ steps.resolve.outputs.name }}"
          if [ ! -f "${DIR}/package.json" ]; then
            echo "::error::plugin directory '${DIR}' not found"
            exit 1
          fi
          PKG_NAME="$(node -p "require('./${DIR}/package.json').name")"
          PKG_VER="$(node -p "require('./${DIR}/package.json').version")"
          if [ "${PKG_NAME}" != "${{ steps.resolve.outputs.name }}" ]; then
            echo "::error::tag plugin '${{ steps.resolve.outputs.name }}' does not match package name '${PKG_NAME}'"
            exit 1
          fi
          if [ "${PKG_VER}" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::tag version '${{ steps.resolve.outputs.version }}' does not match package version '${PKG_VER}'"
            exit 1
          fi

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check npm auth and package name
        shell: bash
        run: |
          NAME="${{ steps.resolve.outputs.name }}"
          echo "authenticated as: $(npm whoami --registry=https://registry.npmjs.org)"
          EXISTING="$(npm view "${NAME}" version 2>/dev/null || true)"
          if [ -n "${EXISTING}" ]; then
            echo "::warning::'${NAME}' already exists on npm (latest ${EXISTING}) — publishing requires this account to own it and the version to be new"
          else
            echo "package name '${NAME}' is available"
          fi

      - name: Verify package contents
        working-directory: plugins/${{ steps.resolve.outputs.name }}
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: plugins/${{ steps.resolve.outputs.name }}
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
